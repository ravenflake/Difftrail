[package]
name = "difftrail-desktop"
version = "0.1.3"
description = "Difftrail Windows desktop shell"
authors = ["Difftrail contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
