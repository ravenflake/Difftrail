[package]
name = "difftrail-desktop"
version = "0.1.4"
description = "Difftrail Windows desktop shell"
authors = ["Difftrail contributors"]
edition = "2021"
default-run = "difftrail-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png"] }
tao = "0.35.3"
tauri = { version = "2", features = [] }
tray-icon = "0.24.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
