<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Difftrail logo direction: the offset D</title>
  <desc id="desc">A compact rounded D logo concept for Difftrail with an amber change trail crossing its open center.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#24363a" flood-opacity=".10" />
    </filter>

    <g id="offset-d">
      <path d="M25 18V82H51" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M51 82C68 82 79 70 79 58" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M79 42C79 30 68 18 51 18H25" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M54 50H83" fill="none" stroke="#d6b06e" stroke-width="9" stroke-linecap="round" />
      <circle cx="83" cy="50" r="4.5" fill="#d6b06e" />
    </g>

    <g id="offset-d-mono">
      <path d="M25 18V82H51" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M51 82C68 82 79 70 79 58" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M79 42C79 30 68 18 51 18H25" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M54 50H83" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" />
      <circle cx="83" cy="50" r="4.5" fill="currentColor" />
    </g>

    <style>
      .ui-text { font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
      .eyebrow { fill: #6b787a; font-size: 12px; font-weight: 700; letter-spacing: 2.2px; }
      .eyebrow-light { fill: #9bb0ae; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
      .body { fill: #59626b; font-size: 15px; }
      .small { fill: #697579; font-size: 12px; }
      .small-light { fill: #a6b5b6; font-size: 12px; }
      .card-title { fill: #1f2b35; font-size: 17px; font-weight: 700; }
      .card-copy { fill: #59626b; font-size: 13px; }
      .wordmark { font-size: 37px; letter-spacing: -1.4px; }
      .wordmark-small { font-size: 20px; letter-spacing: -.6px; }
      .note-number { fill: #d6b06e; font-size: 15px; font-weight: 750; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f2efe8" />

  <g class="ui-text">
    <text x="72" y="64" class="eyebrow">DIFFTRAIL / LOGO DIRECTION 02</text>
    <text x="72" y="119" fill="#1f2b35" font-size="46" font-weight="700" letter-spacing="-1.8">The offset D</text>
    <text x="72" y="153" class="body">A compact identity mark built from the product name and the UI’s own line language.</text>

    <g transform="translate(1067 52)">
      <rect width="45" height="8" rx="4" fill="#1f3038" />
      <rect x="55" width="45" height="8" rx="4" fill="#125e69" />
      <rect x="110" width="45" height="8" rx="4" fill="#d6b06e" />
      <text x="0" y="30" class="small">sidebar / teal / change point</text>
    </g>

    <!-- Sidebar lockup -->
    <g filter="url(#shadow)">
      <rect x="72" y="205" width="760" height="260" rx="18" fill="#1f3038" />
    </g>
    <text x="106" y="244" class="eyebrow-light">SIDEBAR LOCKUP</text>
    <g transform="translate(112 279) scale(1.08)" color="#f5f1e8">
      <use href="#offset-d" />
    </g>
    <text x="239" y="329" class="wordmark" fill="#f5f1e8" font-weight="700">Diff<tspan fill="#c5d3d0" font-weight="500">trail</tspan></text>
    <text x="241" y="358" class="small-light">Know what changed.</text>
    <path d="M239 389H706" stroke="#40575d" />
    <text x="239" y="420" class="small-light">A familiar letterform with one visible difference.</text>
    <text x="239" y="440" class="small-light">The amber line can disappear for a one-color version.</text>

    <!-- App icon and light treatment -->
    <rect x="860" y="205" width="468" height="260" rx="18" fill="#fffdf9" stroke="#e5e0d6" />
    <text x="894" y="244" class="eyebrow">APP ICON + LIGHT USE</text>
    <g filter="url(#shadow)">
      <rect x="894" y="268" width="154" height="154" rx="34" fill="#1f3038" />
    </g>
    <g transform="translate(916 290) scale(1.24)" color="#f5f1e8">
      <use href="#offset-d" />
    </g>
    <g transform="translate(1087 270) scale(.92)" color="#125e69">
      <use href="#offset-d" />
    </g>
    <text x="1091" y="373" class="wordmark-small" fill="#1f2b35" font-weight="700">Diff<tspan fill="#59626b" font-weight="500">trail</tspan></text>
    <text x="1091" y="401" class="small">dark tile or teal-on-paper</text>

    <!-- Why it fits -->
    <rect x="72" y="497" width="760" height="258" rx="18" fill="#fffdf9" stroke="#e5e0d6" />
    <text x="106" y="537" class="eyebrow">WHY THIS FITS THE UI</text>
    <text x="106" y="578" class="card-title">More icon, less illustration.</text>

    <text x="109" y="622" class="note-number">01</text>
    <text x="149" y="622" fill="#1f2b35" font-size="14" font-weight="700">Compact</text>
    <text x="149" y="643" class="card-copy">The mark holds inside the same small footprint as the current sidebar icon.</text>

    <text x="109" y="682" class="note-number">02</text>
    <text x="149" y="682" fill="#1f2b35" font-size="14" font-weight="700">Native</text>
    <text x="149" y="703" class="card-copy">Rounded strokes and an open center echo the existing navigation icons.</text>

    <text x="109" y="742" class="note-number">03</text>
    <text x="149" y="742" fill="#1f2b35" font-size="14" font-weight="700">Ownable</text>
    <text x="230" y="742" class="card-copy">The D makes the product name recognizable before the wordmark is read.</text>

    <!-- Anatomy / scale -->
    <rect x="860" y="497" width="468" height="258" rx="18" fill="#1f3038" />
    <text x="894" y="537" class="eyebrow-light">ANATOMY</text>
    <g transform="translate(905 572) scale(.84)" color="#f5f1e8">
      <use href="#offset-d" />
    </g>
    <path d="M980 598H1038" stroke="#40575d" />
    <circle cx="1046" cy="598" r="5" fill="#d6b06e" />
    <text x="1064" y="594" class="small-light">“what changed”</text>
    <text x="1064" y="612" class="small-light">crosses the D</text>
    <path d="M894 663H1294" stroke="#40575d" />
    <text x="894" y="700" class="small-light">Monochrome fallback: keep the open center</text>
    <text x="894" y="720" class="small-light">and let the shape carry the identity.</text>

    <text x="72" y="832" class="eyebrow">DIRECTIONAL NOTE</text>
    <text x="72" y="858" fill="#59626b" font-size="14">This keeps the palette and removes the branching / diagram feel.</text>
    <text x="1328" y="858" fill="#6b787a" font-size="12" text-anchor="end">VECTOR PREVIEW · NOT WIRED TO UI</text>
  </g>
</svg>
