name: Bug report
description: Report a reproducible Difftrail defect without sharing private host data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Difftrail. Do not attach a real journal, Event Log export, username, private path, token, or unreviewed diagnostic bundle. Report security issues through the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Difftrail version or commit
      placeholder: v0.1.3 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Windows installer
        - Source checkout (desktop)
        - Source checkout (CLI)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows edition, version, and build
      description: Use `winver`; omit device names and organization details.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: State the observed behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Prefer a disposable database or synthetic fixture. Redact usernames and paths.
      placeholder: |
        1. Start with...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Include only aggregate output such as scan status, error bucket, or `doctor --json` fields after checking that they contain no private data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, usernames, private paths, raw Event Log text, journals, and other sensitive host information.
          required: true
        - label: This is not a security vulnerability.
          required: true

