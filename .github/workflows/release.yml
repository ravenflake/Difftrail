name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Parse release tag
        id: release_tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(
              r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?",
              tag,
          )
          if match is None:
              raise SystemExit(
                  "Release tag must match vMAJOR.MINOR.PATCH with an optional "
                  f"SemVer prerelease suffix, got {tag!r}"
              )
          expected = ".".join(match.group(index) for index in range(1, 4))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"expected={expected}\n")
          PY

      - name: Check release metadata consistency
        env:
          EXPECTED_VERSION: ${{ steps.release_tag.outputs.expected }}
        run: python scripts/check_release_metadata.py --expected "${EXPECTED_VERSION}"

  publish-artifact:
    needs: validate-version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install UI dependencies
        run: npm ci

      - name: Install backend build tooling
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.22.0"

      - name: Build Windows installer
        run: npm run desktop:build

      - name: Validate installer artifact with silent install/uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File | Select-Object -First 1
          if ($null -eq $installer) { throw "No NSIS installer was produced" }
          & "$env:GITHUB_WORKSPACE/scripts/validate-installer.ps1" -InstallerPath $installer.FullName

      - name: Publish Windows installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: difftrail-windows-installer-${{ github.ref_name }}
          path: ui/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  create-release:
    needs: publish-artifact
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: difftrail-windows-installer-${{ github.ref_name }}
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mapfile -t installers < <(find release-assets -type f -name '*-setup.exe' -print)
          if (( ${#installers[@]} == 0 )); then
            echo "No Windows installer was found in the downloaded artifact."
            exit 1
          fi

          (
            cd release-assets
            sha256sum -- *-setup.exe > SHA256SUMS.txt
          )
          checksum_file="release-assets/SHA256SUMS.txt"

          release_title="Difftrail $RELEASE_TAG"
          prerelease=false
          if [[ "$RELEASE_TAG" == "v0.1.0" ]]; then
            release_title="Difftrail $RELEASE_TAG — MVP Foundation"
            prerelease=true
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi

          previous_tag="$(gh release list \
            --repo "$REPOSITORY" \
            --limit 100 \
            --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[0].tagName')"

          release_args=(
            "$RELEASE_TAG"
            "${installers[@]}"
            "$checksum_file"
            --repo "$REPOSITORY"
            --title "$release_title"
            --generate-notes
            --verify-tag
          )

          if [[ -n "$previous_tag" && "$previous_tag" != "$RELEASE_TAG" ]]; then
            release_args+=(--notes-start-tag "$previous_tag")
          fi

          if [[ "$prerelease" == true ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${installers[@]}" "$checksum_file" --repo "$REPOSITORY" --clobber
          else
            gh release create "${release_args[@]}"
          fi
