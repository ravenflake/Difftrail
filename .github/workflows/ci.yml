name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --no-deps --editable .

      - name: Compile source
        run: python -m compileall -q difftrail tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic validation
        run: python -m difftrail validate

      - name: Run scanner-backed fixture validation
        run: python -m difftrail validate-scenarios

      - name: Run host-report smoke test
        run: 'python -m difftrail --db ":memory:" validate-host --json'

  ui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install UI dependencies
        run: npm ci

      - name: Run UI unit tests
        run: npm test

      - name: Install backend build tooling
        run: python -m pip install --disable-pip-version-check "pyinstaller>=6.0"

      - name: Build UI
        run: npm run desktop:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: difftrail-windows-installer
          path: ui/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
