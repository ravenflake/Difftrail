name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --no-deps --editable .

      - name: Compile source
        run: python -m compileall -q difftrail tests

      - name: Check release metadata
        if: matrix.python-version == '3.12'
        run: python scripts/check_release_metadata.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic validation
        run: python -m difftrail validate

      - name: Run scanner-backed fixture validation
        run: python -m difftrail validate-scenarios

      - name: Run journal doctor smoke test
        shell: pwsh
        run: |
          $database = Join-Path $env:RUNNER_TEMP "difftrail-doctor-smoke.db"
          python -m difftrail --db $database doctor --json

      - name: Run redacted bundle export and validation smoke test
        shell: pwsh
        run: |
          $database = Join-Path $env:RUNNER_TEMP "difftrail-bundle-smoke.db"
          $bundle = Join-Path $env:RUNNER_TEMP "difftrail-bundle-smoke.json"
          python -m difftrail --db $database simulate nvidia-driver-switch --json
          if ($LASTEXITCODE -ne 0) { throw "simulate smoke test failed with exit code $LASTEXITCODE" }
          python -m difftrail --db $database export-bundle --output $bundle --json
          if ($LASTEXITCODE -ne 0) { throw "export-bundle smoke test failed with exit code $LASTEXITCODE" }
          python -m difftrail validate-bundle $bundle --json
          if ($LASTEXITCODE -ne 0) { throw "validate-bundle smoke test failed with exit code $LASTEXITCODE" }

      - name: Run host-report smoke test
        run: 'python -m difftrail --db ":memory:" validate-host --json'

  ui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install UI dependencies
        run: npm ci

      - name: Identify CI build
        id: ci_build
        shell: pwsh
        env:
          BUILD_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $commitSha = $env:BUILD_COMMIT_SHA.Trim()
          if ($commitSha.Length -lt 7) { throw "The build commit SHA is too short" }
          $shortSha = $commitSha.Substring(0, 7).ToLowerInvariant()
          "short_sha=$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ("${{ github.event_name }}" -eq "pull_request") {
            "artifact_name=difftrail-windows-installer-pr-$($env:PR_NUMBER)-$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "artifact_name=difftrail-windows-installer-main-$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Stamp pull-request build version
        if: github.event_name == 'pull_request'
        id: stamp_build
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: python ../scripts/stamp_build_version.py --pr-number "$env:PR_NUMBER" --commit-sha "$env:BUILD_COMMIT_SHA"

      - name: Audit locked UI dependencies
        run: npm audit --package-lock-only --audit-level=high

      - name: Run UI unit tests
        run: npm test

      - name: Build and type-check UI
        run: npm run build

      - name: Run desktop shell unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Install backend build tooling
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.22.0"

      - name: Build versioned pull-request UI
        if: github.event_name == 'pull_request'
        run: npm run desktop:build -- --config src-tauri/tauri.build.conf.json

      - name: Build UI
        if: github.event_name != 'pull_request'
        run: npm run desktop:build

      - name: Validate installer artifact with silent install/uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File | Select-Object -First 1
          if ($null -eq $installer) { throw "No NSIS installer was produced" }
          & "$env:GITHUB_WORKSPACE/scripts/validate-installer.ps1" -InstallerPath $installer.FullName

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.ci_build.outputs.artifact_name }}
          path: ui/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
