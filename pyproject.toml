[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "difftrail"
version = "0.1.4"
description = "A local-first Windows change journal and evidence-review tool."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "Difftrail contributors"}]
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller==6.22.2"]

[project.urls]
Homepage = "https://github.com/ravenflake/Difftrail"
Repository = "https://github.com/ravenflake/Difftrail"
Issues = "https://github.com/ravenflake/Difftrail/issues"

[project.scripts]
difftrail = "difftrail.cli:main"

[tool.setuptools.packages.find]
include = ["difftrail*"]
